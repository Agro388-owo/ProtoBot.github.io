<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            background-color: #000;
            background-image: url('backround-2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top 404 Text Section */
        .text-container {
            margin-top: 5vh;
            text-align: center;
            color: #000000;
            z-index: 10;
        }

        .text-container h1 {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 400;
            line-height: 1;
            margin-bottom: 5px;
        }

        .text-container p {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 400;
        }

        /* Bottom Right - Shocked Puro */
        .puro-img {
            position: absolute;
            bottom: 0;
            right: 2vw;
            height: 45vh;
            max-height: 450px;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        /* Bottom Left - Almost Transparent OC */
        .buff-oc {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 25vh;
            max-height: 250px;
            object-fit: contain;
            opacity: 0.12; /* ~88% transparent */
            z-index: 4;
            pointer-events: none;
        }

        /* Optional: Home Redirect Link on click anywhere */
        a.full-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="text-container">
        <h1>404</h1>
        <p>Page not found</p>
    </div>

    <!-- Bottom Left Faint OC -->
    <img class="buff-oc" src="buff-oc-red.png" alt="OC silhouette">

    <!-- Bottom Right Character -->
    <img class="puro-img" src="Shocked_floof.webp" alt="Shocked Puro">

    <!-- Clicking anywhere returns to main page -->
    <a href="/" class="full-link" title="Return to home"></a>

</body>
</html>
